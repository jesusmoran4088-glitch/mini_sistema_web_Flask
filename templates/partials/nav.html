<nav class="navbar">
    <a href="{{ url_for('users.index') }}" class="logo">🏠 FlaskUsers</a>
    <div class="nav-links">
        {% if session.get('user_id') %}
            <a href="{{ url_for('users.profile', id=session['user_id']) }}">
                Mi perfil ({{ session['username']|capitalize }})
            </a>
            <a href="{{ url_for('users.logout') }}">Cerrar sesión</a>
        {% else %}
            <a href="{{ url_for('users.register') }}">Registrarse</a>
            <a href="{{ url_for('users.login') }}">Iniciar sesión</a>
        {% endif %}
    </div>
</nav>
